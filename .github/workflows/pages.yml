name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: juninmd/base-actions/.github/workflows/reusable-pages.yml@main
    with:
      build-command: |
        npm run build
        cp _site/index.html _site/404.html
      artifact-path: _site
